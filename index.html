            applyImageTransform();
            updateZoomPercentage();
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeImageModal() {
            const modal = document.getElementById('image-modal');
            modal.classList.remove('show');
            document.body.style.overflow = '';
            if (imageModalState.animationId) {
                cancelAnimationFrame(imageModalState.animationId);
                imageModalState.animationId = null;
            }
            imageModalState.activePointers.clear();
        }

        function resetImageZoom() {
            imageModalState.targetScale = 1.0;
            imageModalState.targetTranslateX = 0;
            imageModalState.targetTranslateY = 0;
            startImageAnimation();
            updateZoomPercentage();
        }

        function applyImageTransform() {
            const img = document.getElementById('modal-image');
            if (!img) return;
            img.style.transform = `translate3d(${imageModalState.translateX}px, ${imageModalState.translateY}px, 0) scale(${imageModalState.scale})`;
        }

        function startImageAnimation() {
            if (imageModalState.animationId) return;
            const animate = () => {
                const s = imageModalState;
                const dxS = s.targetScale - s.scale;
                const dxX = s.targetTranslateX - s.translateX;
                const dy = s.targetTranslateY - s.translateY;
                if (Math.abs(dxS) < 0.001 && Math.abs(dxX) < 0.2 && Math.abs(dy) < 0.2) {
                    s.scale = s.targetScale;
                    s.translateX = s.targetTranslateX;
                    s.translateY = s.targetTranslateY;
                    applyImageTransform();
                    s.animationId = null;
                    return;
                }
                s.scale += dxS * SMOOTH_FACTOR;
                s.translateX += dxX * SMOOTH_FACTOR;
                s.translateY += dy * SMOOTH_FACTOR;
                applyImageTransform();
                s.animationId = requestAnimationFrame(animate);
            };
            imageModalState.animationId = requestAnimationFrame(animate);
        }

        function updateZoomPercentage() {
            const el = document.getElementById('zoom-percentage');
            if (el) {
                const displayPercent = Math.round(imageModalState.targetScale * 100);
                el.textContent = displayPercent + '%';
                el.classList.remove('pulse');
                void el.offsetWidth;
                el.classList.add('pulse');
            }
        }

        function clampValues(scale, tx, ty) {
            const wrapper = document.getElementById('modal-image-wrapper');
            const img = document.getElementById('modal-image');
            if (!wrapper || !img) return { tx, ty };
            if (scale <= MIN_SCALE) return { tx: 0, ty: 0 };
            const nw = img.naturalWidth, nh = img.naturalHeight;
            if (!nw || !nh) return { tx, ty };
            const cw = wrapper.clientWidth, ch = wrapper.clientHeight;
            const fitRatio = Math.min(cw / nw, ch / nh);
            const dw = nw * fitRatio * scale;
            const dh = nh * fitRatio * scale;
            const maxTx = Math.max(0, (dw - cw) / 2);
            const maxTy = Math.max(0, (dh - ch) / 2);
            return {
                tx: Math.min(Math.max(tx, -maxTx), maxTx),
                ty: Math.min(Math.max(ty, -maxTy), maxTy),
            };
        }

        function zoomAtPoint(factor, containerX, containerY) {
            const wrapper = document.getElementById('modal-image-wrapper');
            if (!wrapper) return;
            const cw = wrapper.clientWidth, ch = wrapper.clientHeight;
            const cx = containerX - cw / 2;
            const cy = containerY - ch / 2;
            const oldScale = imageModalState.targetScale;
            let newScale = oldScale * factor;
            newScale = Math.min(Math.max(newScale, MIN_SCALE), MAX_SCALE);
            if (Math.abs(newScale - oldScale) < 0.0001) return;
            const px = (cx - imageModalState.targetTranslateX) / oldScale;
            const py = (cy - imageModalState.targetTranslateY) / oldScale;
            let newTx = cx - px * newScale;
            let newTy = cy - py * newScale;
            const c = clampValues(newScale, newTx, newTy);
            newTx = c.tx;
            newTy = c.ty;
            if (newScale <= MIN_SCALE) { newTx = 0; newTy = 0; }
            imageModalState.targetScale = newScale;
            imageModalState.targetTranslateX = newTx;
            imageModalState.targetTranslateY = newTy;
            startImageAnimation();
            updateZoomPercentage();
        }

        function zoomAtCenter(factor) {
            const wrapper = document.getElementById('modal-image-wrapper');
            if (!wrapper) return;
            zoomAtPoint(factor, wrapper.clientWidth / 2, wrapper.clientHeight / 2);
        }

        function initImageModalEvents() {
            const wrapper = document.getElementById('modal-image-wrapper');
            if (!wrapper) return;

            wrapper.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                imageModalState.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (imageModalState.animationId) {
                    cancelAnimationFrame(imageModalState.animationId);
                    imageModalState.animationId = null;
                }
                imageModalState.targetScale = imageModalState.scale;
                imageModalState.targetTranslateX = imageModalState.translateX;
                imageModalState.targetTranslateY = imageModalState.translateY;

                if (imageModalState.activePointers.size === 1) {
                    imageModalState.isDragging = true;
                    imageModalState.lastTouchX = e.clientX;
                    imageModalState.lastTouchY = e.clientY;
                    wrapper.classList.add('grabbing');
                    try { wrapper.setPointerCapture(e.pointerId); } catch(err) {}
                } else if (imageModalState.activePointers.size === 2) {
                    imageModalState.isDragging = false;
                    const pts = Array.from(imageModalState.activePointers.values());
                    const dx = pts[0].x - pts[1].x;
                    const dy = pts[0].y - pts[1].y;
                    imageModalState.pinchStartDist = Math.sqrt(dx * dx + dy * dy);
                    imageModalState.pinchStartScale = imageModalState.scale;
                    imageModalState.pinchStartTx = imageModalState.translateX;
                    imageModalState.pinchStartTy = imageModalState.translateY;
                }
            });

            wrapper.addEventListener('pointermove', (e) => {
                if (!imageModalState.activePointers.has(e.pointerId)) return;
                e.preventDefault();
                imageModalState.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (imageModalState.activePointers.size === 1 && imageModalState.isDragging) {
                    const dx = e.clientX - imageModalState.lastTouchX;
                    const dy = e.clientY - imageModalState.lastTouchY;
                    const newTx = imageModalState.translateX + dx;
                    const newTy = imageModalState.translateY + dy;
                    const c = clampValues(imageModalState.scale, newTx, newTy);
                    imageModalState.translateX = c.tx;
                    imageModalState.translateY = c.ty;
                    imageModalState.targetScale = imageModalState.scale;
                    imageModalState.targetTranslateX = c.tx;
                    imageModalState.targetTranslateY = c.ty;
                    applyImageTransform();
                    imageModalState.lastTouchX = e.clientX;
                    imageModalState.lastTouchY = e.clientY;
                } else if (imageModalState.activePointers.size === 2) {
                    const pts = Array.from(imageModalState.activePointers.values());
                    const dx = pts[0].x - pts[1].x;
                    const dy = pts[0].y - pts[1].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (imageModalState.pinchStartDist > 0) {
                        let newScale = imageModalState.pinchStartScale * (dist / imageModalState.pinchStartDist);
                        newScale = Math.min(Math.max(newScale, MIN_SCALE), MAX_SCALE);
                        const ratio = newScale / imageModalState.pinchStartScale;
                        let newTx = imageModalState.pinchStartTx * ratio;
                        let newTy = imageModalState.pinchStartTy * ratio;
                        const c = clampValues(newScale, newTx, newTy);
                        newTx = c.tx;
                        newTy = c.ty;
                        if (newScale <= MIN_SCALE) { newTx = 0; newTy = 0; }
                        imageModalState.scale = newScale;
                        imageModalState.translateX = newTx;
                        imageModalState.translateY = newTy;
                        imageModalState.targetScale = newScale;
                        imageModalState.targetTranslateX = newTx;
                        imageModalState.targetTranslateY = newTy;
                        applyImageTransform();
                        updateZoomPercentage();
                    }
                }
            });

            const endPointer = (e) => {
                if (!imageModalState.activePointers.has(e.pointerId)) return;
                imageModalState.activePointers.delete(e.pointerId);
                if (imageModalState.activePointers.size === 0) {
                    imageModalState.isDragging = false;
                    wrapper.classList.remove('grabbing');
                    imageModalState.targetScale = imageModalState.scale;
                    imageModalState.targetTranslateX = imageModalState.translateX;
                    imageModalState.targetTranslateY = imageModalState.translateY;
                } else if (imageModalState.activePointers.size === 1) {
                    const remaining = Array.from(imageModalState.activePointers.values())[0];
                    imageModalState.isDragging = true;
                    imageModalState.lastTouchX = remaining.x;
                    imageModalState.lastTouchY = remaining.y;
                }
            };

            wrapper.addEventListener('pointerup', endPointer);
            wrapper.addEventListener('pointercancel', endPointer);

            let lastTapTime = 0, lastTapX = 0, lastTapY = 0;
            wrapper.addEventListener('pointerup', (e) => {
                if (e.pointerType === 'mouse') return;
                const now = Date.now();
                if (now - lastTapTime < 300 && Math.abs(e.clientX - lastTapX) < 30 && Math.abs(e.clientY - lastTapY) < 30) {
                    const rect = wrapper.getBoundingClientRect();
                    const tx = e.clientX - rect.left;
                    const ty = e.clientY - rect.top;
                    if (imageModalState.targetScale < 1.9) {
                        zoomAtPoint(2.0 / imageModalState.targetScale, tx, ty);
                    } else {
                        resetImageZoom();
                    }
                    lastTapTime = 0;
                } else {
                    lastTapTime = now;
                    lastTapX = e.clientX;
                    lastTapY = e.clientY;
                }
            });

            wrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = wrapper.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                let factor;
                if (e.deltaMode === 0) factor = Math.exp(-e.deltaY * 0.0018);
                else if (e.deltaMode === 1) factor = Math.exp(-e.deltaY * 0.06);
                else factor = Math.exp(-e.deltaY * 0.4);
                factor = Math.min(Math.max(factor, 0.75), 1.33);
                zoomAtPoint(factor, mx, my);
            }, { passive: false });

            window.addEventListener('resize', () => {
                if (document.getElementById('image-modal').classList.contains('show')) {
                    const c = clampValues(imageModalState.scale, imageModalState.translateX, imageModalState.translateY);
                    imageModalState.translateX = c.tx;
                    imageModalState.translateY = c.ty;
                    imageModalState.targetTranslateX = c.tx;
                    imageModalState.targetTranslateY = c.ty;
                    applyImageTransform();
                }
            });
        }

        /* ============ APP LOGIC ============ */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function prepareQuestions(mode) {
            questions = JSON.parse(JSON.stringify(originalQuestions));
            appState.shuffledRightMaps = {};
            if (mode === 'test') {
                shuffleArray(questions);
                questions.forEach(q => {
                    if (q.type === 'single' || q.type === 'multiple') {
                        const correctTexts = q.correct.map(index => q.options[index]);
                        shuffleArray(q.options);
                        q.correct = q.options.map((opt, index) => correctTexts.includes(opt) ? index : -1).filter(i => i !== -1);
                    }
                });
            }
            questions.forEach(q => {
                if (q.type === 'matching') {
                    const rightItems = q.pairs.map((p, i) => ({ text: p.right, originalIndex: i, icon: p.icon }));
                    shuffleArray(rightItems);
                    appState.shuffledRightMaps[q.id] = rightItems;
                }
            });
        }

        function startApp(mode) {
            appState.mode = mode;
            appState.currentQuestionIndex = 0;
            appState.userAnswers = {};
            appState.isChecked = {};
            appState.isReview = false;
            prepareQuestions(mode);
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
            document.getElementById('result-screen').style.display = 'none';
            renderSidebar();
            renderQuestion();
            updateProgress();
        }

        function resetApp() {
            appState.isReview = false;
            document.getElementById('start-screen').style.display = 'flex';
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'none';
        }

        function reviewAnswers() {
            appState.isReview = true;
            document.getElementById('main-screen').style.display = 'flex';
            document.getElementById('result-screen').style.display = 'none';
            appState.currentQuestionIndex = 0;
            renderSidebar();
            renderQuestion();
        }

        function updateProgress() {
            const answered = Object.keys(appState.userAnswers).filter(id => {
                const q = questions.find(q => q.id == id);
                if (!q) return false;
                if (q.type === 'matrix') return (appState.userAnswers[id] || []).filter(x => x !== undefined).length === q.rows.length;
                if (q.type === 'matching') return Object.keys(appState.userAnswers[id] || {}).length === q.pairs.length;
                return (appState.userAnswers[id] || []).length > 0;
            }).length;
            document.getElementById('progress-text').textContent = `${answered}/${questions.length}`;
        }

        function renderSidebar() {
            const grid = document.getElementById('question-grid');
            grid.innerHTML = '';
            questions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = 'q-btn';
                btn.textContent = index + 1;
                btn.onclick = (e) => { e.preventDefault(); appState.currentQuestionIndex = index; renderQuestion(); };
                if (index === appState.currentQuestionIndex) btn.classList.add('active');
                if (appState.isReview || (appState.mode === 'practice' && appState.isChecked[q.id])) {
                    btn.classList.add(checkQuestionCorrectness(q.id) ? 'correct-ans' : 'wrong-ans');
                }
                grid.appendChild(btn);
            });
        }

        function checkQuestionCorrectness(qId) {
            const q = questions.find(q => q.id === qId);
            const userAns = appState.userAnswers[qId];
            if (!userAns) return false;
            if (q.type === 'matching') {
                for (let i = 0; i < q.pairs.length; i++) {
                    if (userAns[i] === undefined || userAns[i] !== q.correct[i]) return false;
                }
                return true;
            } else if (q.type === 'matrix') {
                for (let i = 0; i < q.rows.length; i++) {
                    if (userAns[i] === undefined || userAns[i] !== q.correct[i]) return false;
                }
                return true;
            } else {
                const s = [...userAns].sort();
                const c = [...q.correct].sort();
                return JSON.stringify(s) === JSON.stringify(c);
            }
        }

        function renderQuestion() {
            const index = appState.currentQuestionIndex;
            const q = questions[index];
            const card = document.getElementById('question-card');
            document.querySelectorAll('.q-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
            const isReviewMode = appState.isReview;
            const isChecked = appState.isChecked[q.id] || isReviewMode;

            let typeText = q.type === 'single' ? 'Chọn 1 đáp án' : q.type === 'multiple' ? 'Chọn nhiều đáp án' : q.type === 'matrix' ? 'Đúng / Sai' : 'Kéo thả ghép nối';
            let html = `<div class="question-header"><span class="question-number">Câu hỏi ${index + 1}</span><span class="question-type">${typeText}</span></div>`;

            if (q.image) {
                html += `<div class="question-image-container"><img src="${q.image}" alt="Câu hỏi ${index + 1}" class="clickable-image" data-src="${q.image}" onerror="this.style.display='none'"></div>`;
            }

            html += `<div class="question-text">${q.question}</div>`;

            if (q.type === 'single' || q.type === 'multiple') {
                html += `<div class="options-list">`;
                q.options.forEach((opt, optIndex) => {
                    const isSelected = (appState.userAnswers[q.id] || []).includes(optIndex);
                    let cls = 'option-item';
                    if (isSelected) cls += ' selected';
                    if (isChecked) {
                        const isCorrectOpt = q.correct.includes(optIndex);
                        if (isCorrectOpt) cls += ' correct';
                        else if (isSelected) cls += ' wrong';
                    }
                    html += `<label class="${cls}"><input type="${q.type === 'single' ? 'radio' : 'checkbox'}" name="q_${q.id}" ${isSelected ? 'checked' : ''} ${isChecked ? 'disabled' : ''} onchange="handleOptionChange(${q.id}, ${optIndex}, '${q.type}')"><span class="option-label">${opt}</span></label>`;
                });
                html += `</div>`;
            } else if (q.type === 'matrix') {
                html += `<div class="matrix-grid">`;
                q.rows.forEach((row, rowIndex) => {
                    const userAns = appState.userAnswers[q.id] || [];
                    const sel = userAns[rowIndex];
                    const correctVal = q.correct[rowIndex];
                    const isWrongRow = isChecked && sel !== undefined && sel !== correctVal;
                    const isCorrectRow = isChecked && sel !== undefined && sel === correctVal;
                    let rowCls = 'matrix-row';
                    if (isWrongRow) rowCls += ' row-wrong';
                    if (isCorrectRow) rowCls += ' row-correct';
                    html += `<div class="${rowCls}"><div class="matrix-statement">${row}</div><div class="matrix-options"><label class="matrix-option ${isChecked && correctVal === 0 ? 'opt-correct' : ''} ${isChecked && sel === 0 && correctVal !== 0 ? 'opt-wrong' : ''}"><input type="radio" name="q_${q.id}_r_${rowIndex}" value="0" ${sel === 0 ? 'checked' : ''} ${isChecked ? 'disabled' : ''} onchange="handleMatrixChange(${q.id}, ${rowIndex}, 0)"> Đúng</label><label class="matrix-option ${isChecked && correctVal === 1 ? 'opt-correct' : ''} ${isChecked && sel === 1 && correctVal !== 1 ? 'opt-wrong' : ''}"><input type="radio" name="q_${q.id}_r_${rowIndex}" value="1" ${sel === 1 ? 'checked' : ''} ${isChecked ? 'disabled' : ''} onchange="handleMatrixChange(${q.id}, ${rowIndex}, 1)"> Sai</label></div></div>`;
                });
                html += `</div>`;
            } else if (q.type === 'matching') {
                html += renderMatching(q, isChecked);
            }

            if (isChecked) {
                const ok = checkQuestionCorrectness(q.id);
                html += `<div class="feedback-box show ${ok ? 'correct' : 'wrong'}"><div class="feedback-title">${ok ? 'Chính xác!' : 'Sai rồi!'}</div><div class="explanation-text"><strong>Giải thích:</strong> ${q.explanation}</div></div>`;
            }

            html += `<div class="actions">`;
            if (index > 0) html += `<button class="btn btn-secondary" onclick="prevQuestion()">Câu Trước</button>`;
            if (!isReviewMode) {
                if (appState.mode === 'practice') {
                    if (!isChecked) html += `<button class="btn btn-primary" onclick="checkAnswer()">Kiểm Tra</button>`;
                    if (index < questions.length - 1) html += `<button class="btn btn-secondary" onclick="nextQuestion()">Câu Tiếp Theo</button>`;
                    else html += `<button class="btn btn-success" onclick="calculateResult()">Hoàn Thành</button>`;
                } else {
                    if (index < questions.length - 1) html += `<button class="btn btn-primary" onclick="nextQuestion()">Câu Tiếp Theo</button>`;
                    else html += `<button class="btn btn-success" onclick="calculateResult()">Nộp Bài</button>`;
                }
            } else {
                if (index < questions.length - 1) html += `<button class="btn btn-primary" onclick="nextQuestion()">Câu Tiếp Theo</button>`;
                else html += `<button class="btn btn-success" onclick="resetApp()">Quay Lại Menu</button>`;
            }
            html += `</div>`;

            card.innerHTML = html;
            card.classList.remove('fade-in');
            void card.offsetWidth;
            card.classList.add('fade-in');

            if (q.type === 'matching') initMatchingDrag(q);
            const img = card.querySelector('.clickable-image');
            if (img) img.addEventListener('click', function() { openImageModal(this.dataset.src); });
        }

        function renderMatching(q, isChecked) {
            const userAns = appState.userAnswers[q.id] || {};
            const shuffled = appState.shuffledRightMaps[q.id];
            const placedOriginals = new Set(Object.values(userAns).map(v => parseInt(v)));
            const poolItems = shuffled.filter(item => !placedOriginals.has(item.originalIndex));

            let poolHtml = '';
            if (poolItems.length === 0 && !isChecked) {
                poolHtml = `<div style="color: var(--text-sub); font-size: 0.85rem; padding: 10px;">Đã ghép hết. Bấm "Kiểm Tra" để xem kết quả.</div>`;
            } else {
                poolItems.forEach(item => {
                    poolHtml += `<div class="drag-chip" data-qid="${q.id}" data-original="${item.originalIndex}">${item.text}</div>`;
                });
            }

            let rowsHtml = '';
            q.pairs.forEach((pair, i) => {
                const placed = userAns[i];
                let slotContent = '';
                let slotCls = 'drop-slot';
                if (placed !== undefined && placed !== '') {
                    const placedItem = shuffled.find(it => it.originalIndex === parseInt(placed));
                    if (placedItem) {
                        let chipCls = 'placed-chip';
                        if (isChecked) {
                            slotCls += parseInt(placed) === q.correct[i] ? ' correct-drop' : ' wrong-drop';
                        } else {
                            slotCls += ' filled';
                        }
                        const removeHtml = isChecked ? '' : `<span class="remove-x" onclick="removeMatch(${q.id}, ${i})">×</span>`;
                        slotContent = `<div class="${chipCls}"><span>${placedItem.text}</span>${removeHtml}</div>`;
                    }
                } else {
                    slotContent = `<span class="placeholder">Kéo thả vào đây</span>`;
                }
                const iconSvg = icons[pair.icon] || icons.hdmi;
                rowsHtml += `<div class="match-row" data-row="${i}"><div class="match-left-visual"><div class="match-icon">${iconSvg}</div><div class="match-left-text">${pair.left}</div></div><div class="${slotCls}" data-qid="${q.id}" data-row="${i}">${slotContent}</div></div>`;
            });

            const instruction = isChecked ? '' : '<div class="match-instruction">Kéo thả các thẻ vào ô trống tương ứng. Nhấn nút × để gỡ.</div>';
            return `<div class="match-container">${instruction}<div class="match-pool" data-qid="${q.id}">${poolHtml}</div><div class="match-rows">${rowsHtml}</div></div>`;
        }

        function removeMatch(qId, rowIndex) {
            if (appState.isChecked[qId]) return;
            const current = appState.userAnswers[qId] || {};
            delete current[rowIndex];
            appState.userAnswers[qId] = current;
            updateProgress();
            renderQuestion();
        }

        function initMatchingDrag(q) {
            const chips = document.querySelectorAll(`.drag-chip[data-qid="${q.id}"]`);
            chips.forEach(chip => {
                chip.addEventListener('pointerdown', startDrag, { passive: false });
            });
        }

        let dragContext = null;
        let autoScrollRAF = null;

        function startDrag(e) {
            if (appState.isChecked[currentQuestionId()] || appState.isReview) return;
            e.preventDefault();
            const chip = e.currentTarget;
            const qId = parseInt(chip.dataset.qid);
            const original = parseInt(chip.dataset.original);
            const rect = chip.getBoundingClientRect();
            const ghost = chip.cloneNode(true);
            ghost.className = 'drag-ghost';
            ghost.textContent = chip.textContent;
            ghost.style.left = rect.left + 'px';
            ghost.style.top = rect.top + 'px';
            ghost.style.width = rect.width + 'px';
            document.body.appendChild(ghost);
            chip.classList.add('dragging');
            dragContext = { chip, ghost, qId, original, startX: e.clientX, startY: e.clientY, rect, lastClientY: e.clientY };
            document.addEventListener('pointermove', onDragMove, { passive: false });
            document.addEventListener('pointerup', onDragEnd);
            document.addEventListener('pointercancel', onDragEnd);
            startAutoScroll();
        }

        function startAutoScroll() {
            const EDGE_TOP = 120;
            const EDGE_BOTTOM = 120;
            const MAX_SPEED = 45;
            function tick() {
                if (!dragContext) { autoScrollRAF = null; return; }
                const y = dragContext.lastClientY;
                const vh = window.innerHeight;
                let speed = 0;
                if (y < EDGE_TOP) {
                    const dist = EDGE_TOP - y;
                    speed = -Math.min(MAX_SPEED, Math.round(dist * 0.5));
                } else if (y > vh - EDGE_BOTTOM) {
                    const dist = y - (vh - EDGE_BOTTOM);
                    speed = Math.min(MAX_SPEED, Math.round(dist * 0.5));
                }
                if (speed !== 0) {
                    window.scrollBy(0, speed);
                }
                autoScrollRAF = requestAnimationFrame(tick);
            }
            if (!autoScrollRAF) autoScrollRAF = requestAnimationFrame(tick);
        }

        function onDragMove(e) {
            if (!dragContext) return;
            e.preventDefault();
            dragContext.lastClientY = e.clientY;
            const dx = e.clientX - dragContext.startX;
            const dy = e.clientY - dragContext.startY;
            dragContext.ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(-3deg) scale(1.05)`;
            const el = document.elementFromPoint(e.clientX, e.clientY);
            const slot = el ? el.closest('.drop-slot') : null;
            document.querySelectorAll('.drop-slot.drop-active').forEach(s => s.classList.remove('drop-active'));
            document.querySelectorAll('.match-row.drop-active').forEach(s => s.classList.remove('drop-active'));
            if (slot && parseInt(slot.dataset.qid) === dragContext.qId && !slot.classList.contains('filled')) {
                slot.classList.add('drop-active');
                slot.closest('.match-row')?.classList.add('drop-active');
            }
        }

        function onDragEnd(e) {
            if (!dragContext) return;
            document.removeEventListener('pointermove', onDragMove);
            document.removeEventListener('pointerup', onDragEnd);
            document.removeEventListener('pointercancel', onDragEnd);
            if (autoScrollRAF) { cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
            const el = document.elementFromPoint(e.clientX, e.clientY);
            const slot = el ? el.closest('.drop-slot') : null;
            dragContext.ghost.remove();
            dragContext.chip.classList.remove('dragging');
            document.querySelectorAll('.drop-slot.drop-active').forEach(s => s.classList.remove('drop-active'));
            document.querySelectorAll('.match-row.drop-active').forEach(s => s.classList.remove('drop-active'));
            if (slot && parseInt(slot.dataset.qid) === dragContext.qId && !slot.classList.contains('filled')) {
                const rowIndex = parseInt(slot.dataset.row);
                const current = appState.userAnswers[dragContext.qId] || {};
                current[rowIndex] = dragContext.original;
                appState.userAnswers[dragContext.qId] = current;
                updateProgress();
                renderQuestion();
            } else {
                dragContext.chip.classList.remove('dragging');
            }
            dragContext = null;
        }

        function currentQuestionId() { return questions[appState.currentQuestionIndex]?.id; }

        function handleOptionChange(qId, optIndex, type) {
            if (appState.isChecked[qId] || appState.isReview) return;
            if (type === 'single') appState.userAnswers[qId] = [optIndex];
            else {
                let cur = appState.userAnswers[qId] || [];
                cur = cur.includes(optIndex) ? cur.filter(i => i !== optIndex) : [...cur, optIndex];
                appState.userAnswers[qId] = cur;
            }
            updateProgress();
            const card = document.getElementById('question-card');
            card.querySelectorAll('.option-item').forEach((opt) => {
                const input = opt.querySelector('input');
                opt.classList.toggle('selected', input.checked);
            });
        }

        function handleMatrixChange(qId, rowIndex, value) {
            if (appState.isChecked[qId] || appState.isReview) return;
            let cur = appState.userAnswers[qId] || [];
            cur[rowIndex] = value;
            appState.userAnswers[qId] = cur;
            updateProgress();
        }

        function checkAnswer() {
            if (appState.isReview) return;
            appState.isChecked[currentQuestionId()] = true;
            renderSidebar();
            renderQuestion();
        }

        function nextQuestion() {
            if (appState.currentQuestionIndex < questions.length - 1) {
                appState.currentQuestionIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (appState.currentQuestionIndex > 0) {
                appState.currentQuestionIndex--;
                renderQuestion();
            }
        }

        function calculateResult() {
            let correctCount = 0;
            questions.forEach(q => { if (checkQuestionCorrectness(q.id)) correctCount++; });
            const score = correctCount * 10;
            const percentage = Math.round((correctCount / questions.length) * 100);
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
            document.getElementById('score-text').textContent = percentage + '%';
            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('total-score').textContent = score;
            document.getElementById('score-circle').style.background = `conic-gradient(var(--primary) ${percentage}%, var(--border) ${percentage}%)`;
            const iconEl = document.getElementById('result-icon');
            const msgEl = document.getElementById('result-message');
            if (score === 450) {
                iconEl.textContent = '✓';
                iconEl.className = 'result-status-icon pass';
                msgEl.textContent = 'Xin chúc mừng! Bạn đã đậu!';
                msgEl.className = 'result-message pass';
            } else {
                iconEl.textContent = '✗';
                iconEl.className = 'result-status-icon fail';
                msgEl.textContent = 'Rất tiếc! Bạn đã trượt! Hãy làm lại.';
                msgEl.className = 'result-message fail';
            }
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => { if (e.target.tagName !== 'DIV' || !e.target.classList.contains('drag-chip')) e.preventDefault(); });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); showWarning(); return false; }
            if (e.ctrlKey && e.shiftKey && 'IJCSijcs'.includes(e.key)) { e.preventDefault(); showWarning(); return false; }
            if (e.ctrlKey && 'UuSs'.includes(e.key)) { e.preventDefault(); showWarning(); return false; }
            if (e.metaKey && e.altKey && 'IJCSijcs'.includes(e.key)) { e.preventDefault(); showWarning(); return false; }
        });

        let warningTimer = null;
        function showWarning() {
            const w = document.getElementById('devtools-warning');
            w.classList.add('show');
            if (warningTimer) clearTimeout(warningTimer);
            warningTimer = setTimeout(() => w.classList.remove('show'), 2500);
        }

        let devtoolsOpen = false;
        setInterval(() => {
            const w = window.outerWidth - window.innerWidth;
            const h = window.outerHeight - window.innerHeight;
            const isOpen = w > 160 || h > 160;
            if (isOpen && !devtoolsOpen) { devtoolsOpen = true; showWarning(); }
            else if (!isOpen) { devtoolsOpen = false; }
        }, 800);

        document.addEventListener('keydown', function(e) {
            const tag = document.activeElement.tagName;
            const inputType = document.activeElement.type;
            if (tag === 'TEXTAREA' || (tag === 'INPUT' && inputType === 'text')) return;

            if (e.key === 'Escape') {
                if (document.getElementById('image-modal').classList.contains('show')) closeImageModal();
                return;
            }
            if (e.key === 'ArrowLeft') {
                if (appState.currentQuestionIndex > 0) { e.preventDefault(); prevQuestion(); }
                return;
            }
            if (e.key === 'ArrowRight') {
                if (appState.currentQuestionIndex < questions.length - 1) { e.preventDefault(); nextQuestion(); }
                return;
            }
            if (e.key === 'Enter') {
                if (tag === 'BUTTON') return;
                if (appState.isReview) {
                    if (appState.currentQuestionIndex < questions.length - 1) { e.preventDefault(); nextQuestion(); }
                    else { e.preventDefault(); resetApp(); }
                    return;
                }
                if (appState.mode === 'practice') {
                    if (!appState.isChecked[currentQuestionId()]) { e.preventDefault(); checkAnswer(); }
                    else {
                        if (appState.currentQuestionIndex < questions.length - 1) { e.preventDefault(); nextQuestion(); }
                        else { e.preventDefault(); calculateResult(); }
                    }
                } else {
                    if (appState.currentQuestionIndex < questions.length - 1) { e.preventDefault(); nextQuestion(); }
                    else { e.preventDefault(); calculateResult(); }
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            initImageModalEvents();
        });
    </script>
</body>
</html>
